template: zaptec
products:
  - brand: Zaptec
    description:
      generic: Go
  - brand: Zaptec
    description:
      generic: Go 2
  - brand: Zaptec
    description:
      generic: Pro
capabilities: ["rfid", "meter", "dim"]
requirements:
  evcc: ["sponsorship"]
params:
  - name: id
    help:
      de: Wallbox ID
      en: Charger ID
  - name: user
  - name: password
  - name: passive
    type: bool
    description:
      de: "Passivmodus"
      en: "Passive mode"
    help:
      de: "evcc erteilt nur Ladefreigaben/Ladesperren (keine Stromregelung). Aktiviere diese Option nur, wenn die Wallbox Teil eines externen Lastmanagement Systems ist und Stromänderungen ablehnt (HTTP 403)."
      en: "evcc only grants charging authorisations/blocks (no current control). Only activate this option if the wallbox is part of an external load management system and rejects current changes (HTTP 403)."
    advanced: true
  - name: autoStartPrevention
    description:
      de: Automatischen Ladestart verhindern
      en: Prevent automatic charging
    help:
      de: Legt fest, wie beim Einstecken eines Fahrzeugs ein automatischer Ladestart verhindert wird. maxCurrent0 setzt den maximalen Ladestrom vor dem Einstecken auf 0 A. stopCommand sendet einen finalen Stoppbefehl. Ohne Auswahl wird keine Aktion ausgeführt.
      en: Selects how automatic charging is prevented when a vehicle is plugged in. maxCurrent0 sets the maximum charging current to 0 A before plug-in. stopCommand sends a final stop command. When unset, no action is taken.
    type: choice
    choice: [maxCurrent0, stopCommand]
    advanced: true
render: |
  type: zaptec
  id: {{ .id }}
  user: {{ .user }}
  password: {{ .password }}
  passive: {{ .passive }}
  autoStartPrevention: {{ .autoStartPrevention }}
